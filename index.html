<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#fbf3f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Budget du foyer</title>
  <style>
    /* ===== Liquid Glass — thème clair (aurora lumineuse, verre translucide) ===== */
    :root{
      --brand:#2E7DFF; --brand-2:#4FC3E8; --brand-soft:rgba(46,125,255,.12);
      --bg-top:#eef2fb; --bg-bottom:#eaf3f4;
      --surface:rgba(255,255,255,.60); --surface-2:rgba(255,255,255,.44); --surface-3:rgba(255,255,255,.34);
      --text:#17203a; --text-2:#4a5670; --text-3:#7d879c; --text-4:#a7afc0;
      --border:rgba(90,110,150,.16); --border-2:rgba(90,110,150,.10); --border-3:rgba(90,110,150,.22);
      --shadow:0 6px 24px rgba(30,50,90,.07); --shadow-card:0 8px 30px rgba(30,50,90,.08), inset 0 1px 0 rgba(255,255,255,.65);
      --field-bg:rgba(255,255,255,.55); --track:rgba(90,110,150,.16);
      --tabbar-bg:rgba(255,255,255,.55); --tabbar-border:rgba(255,255,255,.6);
      --overlay:rgba(20,30,60,.42); --del:#aab2c4;
      --glass-bg:rgba(255,255,255,.55);
      --glass-bg-strong:rgba(255,255,255,.72);
      --glass-border:rgba(255,255,255,.75);
      --glass-shadow:0 10px 40px rgba(30,50,90,.10), inset 0 1px 0 rgba(255,255,255,.8);
      --bg-gradient:radial-gradient(60% 75% at 12% 8%, rgba(90,150,255,.20), transparent 60%), radial-gradient(55% 70% at 92% 12%, rgba(80,220,210,.16), transparent 55%), radial-gradient(75% 85% at 80% 100%, rgba(170,140,255,.17), transparent 60%), linear-gradient(160deg,#eef2fb,#eaf4f3);
    }
    /* ===== Liquid Glass — thème sombre (aurora profonde) ===== */
    html[data-theme="dark"]{
      --brand:#7FC8FF; --brand-2:#8FE6E0; --brand-soft:rgba(127,200,255,.16);
      --bg-top:#0a1020; --bg-bottom:#080c18;
      --surface:rgba(255,255,255,.085); --surface-2:rgba(255,255,255,.055); --surface-3:rgba(255,255,255,.11);
      --text:#eef2fb; --text-2:#aeb6c8; --text-3:#8790a3; --text-4:#69728a;
      --border:rgba(255,255,255,.14); --border-2:rgba(255,255,255,.08); --border-3:rgba(255,255,255,.20);
      --shadow:0 8px 30px rgba(0,0,0,.4); --shadow-card:0 12px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);
      --field-bg:rgba(255,255,255,.06); --track:rgba(255,255,255,.14);
      --tabbar-bg:rgba(18,24,42,.55); --tabbar-border:rgba(255,255,255,.12);
      --overlay:rgba(0,0,0,.6); --del:#6b7288;
      --glass-bg:rgba(255,255,255,.09); --glass-bg-strong:rgba(26,32,52,.66);
      --glass-border:rgba(255,255,255,.16);
      --glass-shadow:0 12px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
      --bg-gradient:radial-gradient(60% 80% at 15% 10%, rgba(70,130,255,.28), transparent 60%), radial-gradient(50% 70% at 90% 16%, rgba(50,210,200,.18), transparent 55%), radial-gradient(72% 90% at 74% 100%, rgba(150,110,255,.22), transparent 60%), linear-gradient(160deg,#0a1020,#080c18);
    }
    /* ----- Mode auto : suit le réglage système ----- */
    @media (prefers-color-scheme: dark){
      html[data-theme="auto"]{
        --brand:#7FC8FF; --brand-2:#8FE6E0; --brand-soft:rgba(127,200,255,.16);
        --bg-top:#0a1020; --bg-bottom:#080c18;
        --surface:rgba(255,255,255,.085); --surface-2:rgba(255,255,255,.055); --surface-3:rgba(255,255,255,.11);
        --text:#eef2fb; --text-2:#aeb6c8; --text-3:#8790a3; --text-4:#69728a;
        --border:rgba(255,255,255,.14); --border-2:rgba(255,255,255,.08); --border-3:rgba(255,255,255,.20);
        --shadow:0 8px 30px rgba(0,0,0,.4); --shadow-card:0 12px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.10);
        --field-bg:rgba(255,255,255,.06); --track:rgba(255,255,255,.14);
        --tabbar-bg:rgba(18,24,42,.55); --tabbar-border:rgba(255,255,255,.12);
        --overlay:rgba(0,0,0,.6); --del:#6b7288;
        --glass-bg:rgba(255,255,255,.09); --glass-bg-strong:rgba(26,32,52,.66);
        --glass-border:rgba(255,255,255,.16);
        --glass-shadow:0 12px 44px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
        --bg-gradient:radial-gradient(60% 80% at 15% 10%, rgba(70,130,255,.28), transparent 60%), radial-gradient(50% 70% at 90% 16%, rgba(50,210,200,.18), transparent 55%), radial-gradient(72% 90% at 74% 100%, rgba(150,110,255,.22), transparent 60%), linear-gradient(160deg,#0a1020,#080c18);
      }
    }
    /* Liquid Glass : frostifie toutes les cartes (elles utilisent var(--surface*)) */
    #root [style*="var(--surface"],#root [style*="var(--field-bg"]{ -webkit-backdrop-filter:blur(22px) saturate(155%); backdrop-filter:blur(22px) saturate(155%); }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--bg-bottom);}
    body{background:var(--bg-gradient);background-attachment:fixed;background-size:cover;min-height:100vh;}
    html{-webkit-text-size-adjust:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--text);
      transition:background .3s ease;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;
      /* chiffres à largeur fixe : colonnes de montants parfaitement alignées (essentiel en finance) */
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
    input,button{font-family:inherit;color:var(--text);font-variant-numeric:tabular-nums;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--border-3);border-radius:4px;}
    button{-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.22,.61,.36,1),background .2s ease,color .2s ease,box-shadow .2s ease,opacity .15s ease;}
    button:active{transform:scale(.96);opacity:.92;}
    /* anneau de focus iOS sur les champs */
    input:focus,input:focus-visible{outline:none;}
    input:focus-visible{box-shadow:0 0 0 3.5px rgba(46,125,255,.22);border-radius:9px;}
    @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes pop{0%{transform:scale(.96);}100%{transform:scale(1);}}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .tab-panel{animation:fadeSlide .28s cubic-bezier(.22,.61,.36,1);}
    /* respect du réglage système « réduire les animations » */
    @media (prefers-reduced-motion:reduce){
      *,.tab-panel{animation:none!important;transition:none!important;}
      button:active{transform:none;}
    }
    /* bandeau d'installation */
    #install-banner{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;background:#1c1c1e;color:#fff;
      border-radius:16px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideUp .3s ease;}
    #install-banner button{border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
    #install-yes{background:linear-gradient(135deg,#EC3B92,#A855D9);color:#fff;}
    #install-no{background:transparent;color:#8a94a6;}
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="install-banner">
    <span style="font-size:13.5px;font-weight:600;">📲 Installer Budget sur ton écran d'accueil ?</span>
    <span style="display:flex;gap:6px;">
      <button id="install-no">Plus tard</button>
      <button id="install-yes">Installer</button>
    </span>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    window.onerror = (msg, src, line, col, err) => {
      document.getElementById("root").innerHTML =
        '<div style="padding:32px;font-family:system-ui;color:#C8516C;background:#fff;min-height:100vh">' +
        '<strong>Erreur au démarrage</strong><br><br>' +
        '<code style="font-size:12px;white-space:pre-wrap">' + msg + (line ? " (ligne " + line + ")" : "") + "</code>" +
        '<br><br><button onclick="localStorage.clear();location.reload()" style="padding:10px 18px;border-radius:8px;border:none;background:#C8516C;color:#fff;font-weight:700;cursor:pointer">Réinitialiser l\'app</button>' +
        "</div>";
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="core.js"></script>
  <script src="fiscal.js"></script>
  <script src="app.js"></script>

  <script>
    // Service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(console.error);
      });
    }
    // Prompt d'installation (Android / Chrome desktop)
    let deferredPrompt = null;
    const banner = document.getElementById("install-banner");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem("install-dismissed")) banner.style.display = "flex";
    });
    document.getElementById("install-yes").addEventListener("click", async () => {
      banner.style.display = "none";
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    });
    document.getElementById("install-no").addEventListener("click", () => {
      banner.style.display = "none";
      localStorage.setItem("install-dismissed", "1");
    });
  </script>
</body>
</html>
