<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#fbf3f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Budget du foyer</title>
  <style>
    /* ----- Thème clair — identité pastel / magenta ----- */
    :root{
      --brand:#EC3B92; --brand-2:#A855D9; --brand-soft:#FCE7F2;
      --bg-top:#fbf3f9; --bg-bottom:#f1ecfa;
      --surface:#ffffff; --surface-2:#faf4fb; --surface-3:#f3ecf8;
      --text:#241a2e; --text-2:#645a70; --text-3:#9d92ab; --text-4:#c3b8cf;
      --border:#efe4f1; --border-2:#f5eef8; --border-3:#e6d9ec;
      --shadow:0 2px 10px rgba(90,40,110,.05); --shadow-card:0 2px 10px rgba(90,40,110,.05), 0 14px 34px rgba(90,40,110,.05);
      --field-bg:#fbf5fb; --track:#ebe0f0;
      --tabbar-bg:rgba(255,255,255,.80); --tabbar-border:rgba(120,60,120,.08);
      --overlay:rgba(40,20,50,.42); --del:#c8bcd0;
      --glass-bg:rgba(255,255,255,0.74);
      --glass-bg-strong:rgba(255,255,255,0.90);
      --glass-border:rgba(255,255,255,0.7);
      --glass-shadow:0 10px 34px rgba(90,40,110,0.08), 0 1px 0 rgba(255,255,255,0.85) inset;
      --bg-gradient:linear-gradient(155deg, #fdeef7 0%, #f4edfb 44%, #e9f0fe 100%);
    }
    /* ----- Thème sombre — plum profond, accent rose ----- */
    html[data-theme="dark"]{
      --brand:#FF5BA8; --brand-2:#B776E8; --brand-soft:#3a1f33;
      --bg-top:#0c0a12; --bg-bottom:#0a0910;
      --surface:#1a1620; --surface-2:#241f2c; --surface-3:#302a3a;
      --text:#f3eff7; --text-2:#b3aabf; --text-3:#8b8398; --text-4:#6b6479;
      --border:#332c3e; --border-2:#272130; --border-3:#443c50;
      --shadow:0 1px 4px rgba(0,0,0,.5); --shadow-card:0 2px 10px rgba(0,0,0,.4);
      --field-bg:#241f2c; --track:#302a3a;
      --tabbar-bg:rgba(26,22,32,.80); --tabbar-border:rgba(255,255,255,.08);
      --overlay:rgba(0,0,0,.62); --del:#5c5468;
      --glass-bg:rgba(26,22,32,0.74); --glass-bg-strong:rgba(36,31,44,0.90);
      --glass-border:rgba(255,255,255,0.10);
      --glass-shadow:0 10px 34px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;
      --bg-gradient:linear-gradient(160deg,#140a16 0%,#0e0a18 45%,#0a0c18 100%);
    }
    /* ----- Mode auto : suit le réglage système ----- */
    @media (prefers-color-scheme: dark){
      html[data-theme="auto"]{
        --brand:#FF5BA8; --brand-2:#B776E8; --brand-soft:#3a1f33;
        --bg-top:#0c0a12; --bg-bottom:#0a0910;
        --surface:#1a1620; --surface-2:#241f2c; --surface-3:#302a3a;
        --text:#f3eff7; --text-2:#b3aabf; --text-3:#8b8398; --text-4:#6b6479;
        --border:#332c3e; --border-2:#272130; --border-3:#443c50;
        --shadow:0 1px 4px rgba(0,0,0,.5); --shadow-card:0 2px 10px rgba(0,0,0,.4);
        --field-bg:#241f2c; --track:#302a3a;
        --tabbar-bg:rgba(26,22,32,.80); --tabbar-border:rgba(255,255,255,.08);
        --overlay:rgba(0,0,0,.62); --del:#5c5468;
        --glass-bg:rgba(26,22,32,0.74); --glass-bg-strong:rgba(36,31,44,0.90);
        --glass-border:rgba(255,255,255,0.10);
        --glass-shadow:0 10px 34px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;
        --bg-gradient:linear-gradient(160deg,#140a16 0%,#0e0a18 45%,#0a0c18 100%);
      }
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;background:var(--bg-bottom);}
    html{-webkit-text-size-adjust:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--text);
      transition:background .3s ease;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;
      /* chiffres à largeur fixe : colonnes de montants parfaitement alignées (essentiel en finance) */
      font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
    input,button{font-family:inherit;color:var(--text);font-variant-numeric:tabular-nums;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    ::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:var(--border-3);border-radius:4px;}
    button{-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.22,.61,.36,1),background .2s ease,color .2s ease,box-shadow .2s ease,opacity .15s ease;}
    button:active{transform:scale(.96);opacity:.92;}
    /* anneau de focus iOS sur les champs */
    input:focus,input:focus-visible{outline:none;}
    input:focus-visible{box-shadow:0 0 0 3.5px rgba(236,59,146,.20);border-radius:9px;}
    @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes pop{0%{transform:scale(.96);}100%{transform:scale(1);}}
    @keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    .tab-panel{animation:fadeSlide .28s cubic-bezier(.22,.61,.36,1);}
    /* respect du réglage système « réduire les animations » */
    @media (prefers-reduced-motion:reduce){
      *,.tab-panel{animation:none!important;transition:none!important;}
      button:active{transform:none;}
    }
    /* bandeau d'installation */
    #install-banner{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:200;background:#1c1c1e;color:#fff;
      border-radius:16px;padding:13px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;
      box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideUp .3s ease;}
    #install-banner button{border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;}
    #install-yes{background:linear-gradient(135deg,#EC3B92,#A855D9);color:#fff;}
    #install-no{background:transparent;color:#8a94a6;}
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="install-banner">
    <span style="font-size:13.5px;font-weight:600;">📲 Installer Budget sur ton écran d'accueil ?</span>
    <span style="display:flex;gap:6px;">
      <button id="install-no">Plus tard</button>
      <button id="install-yes">Installer</button>
    </span>
  </div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script>
    window.onerror = (msg, src, line, col, err) => {
      document.getElementById("root").innerHTML =
        '<div style="padding:32px;font-family:system-ui;color:#C8516C;background:#fff;min-height:100vh">' +
        '<strong>Erreur au démarrage</strong><br><br>' +
        '<code style="font-size:12px;white-space:pre-wrap">' + msg + (line ? " (ligne " + line + ")" : "") + "</code>" +
        '<br><br><button onclick="localStorage.clear();location.reload()" style="padding:10px 18px;border-radius:8px;border:none;background:#C8516C;color:#fff;font-weight:700;cursor:pointer">Réinitialiser l\'app</button>' +
        "</div>";
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="core.js"></script>
  <script src="fiscal.js"></script>
  <script src="app.js"></script>

  <script>
    // Service worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(console.error);
      });
    }
    // Prompt d'installation (Android / Chrome desktop)
    let deferredPrompt = null;
    const banner = document.getElementById("install-banner");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem("install-dismissed")) banner.style.display = "flex";
    });
    document.getElementById("install-yes").addEventListener("click", async () => {
      banner.style.display = "none";
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
    });
    document.getElementById("install-no").addEventListener("click", () => {
      banner.style.display = "none";
      localStorage.setItem("install-dismissed", "1");
    });
  </script>
</body>
</html>
